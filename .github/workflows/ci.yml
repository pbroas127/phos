name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Metal toolchain for MLX
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Pick simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          echo "name=$DEVICE" >> $GITHUB_OUTPUT
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project Phos.xcodeproj -scheme PhosTests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|warning: unre|Test Case .* failed|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log
      - name: Build app and extensions
        run: |
          set -o pipefail
          xcodebuild build -project Phos.xcodeproj -scheme Phos \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log || { grep -E -A12 "Undefined symbols|ld: |duplicate symbol|error:" build.log | head -120; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
